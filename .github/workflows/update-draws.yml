name: update-draws
on:
  schedule:
    - cron: "0 16 * * 6" # 일요일 01:00 KST, 주 1회
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_draws.py
      - name: Commit
        run: |
          git diff --quiet draws.json && exit 0
          git config user.name "draws-bot"
          git config user.email "draws-bot@users.noreply.github.com"
          git add draws.json
          git commit -m "draws: update"
          git push
